name: Repository Automation Dispatcher

on:
  workflow_run:
    workflows: ["Repository Automation: Trigger"]
    types: [completed]

jobs:
  validate-pr-metadata:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      is_pr: ${{ steps.pr-context.outputs.is_pr }}
      pr_number: ${{ steps.pr-context.outputs.pr_number }}
      head_sha: ${{ steps.pr-context.outputs.head_sha }}
      base_sha: ${{ steps.pr-context.outputs.base_sha }}
      head_ref: ${{ steps.pr-context.outputs.head_ref }}
      base_ref: ${{ steps.pr-context.outputs.base_ref }}
      repository: ${{ steps.pr-context.outputs.repository }}
      event_action: ${{ steps.pr-context.outputs.event_action }}
    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and extract PR metadata
        id: pr-context
        run: |
          cat metadata.json

          # Check if this is a pull_request event (not an issue)
          EVENT_TYPE=$(jq -r '.type' metadata.json)
          if [ "$EVENT_TYPE" != "pull_request" ]; then
            echo "Not a pull request event, skipping"
            echo "is_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract PR metadata
          echo "is_pr=true" >> $GITHUB_OUTPUT
          echo "pr_number=$(jq -r '.number' metadata.json)" >> $GITHUB_OUTPUT
          echo "head_sha=$(jq -r '.head.sha' metadata.json)" >> $GITHUB_OUTPUT
          echo "base_sha=$(jq -r '.base.sha' metadata.json)" >> $GITHUB_OUTPUT
          echo "head_ref=$(jq -r '.head.ref' metadata.json)" >> $GITHUB_OUTPUT
          echo "base_ref=$(jq -r '.base.ref' metadata.json)" >> $GITHUB_OUTPUT
          echo "repository=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "event_action=$(jq -r '.event_action' metadata.json)" >> $GITHUB_OUTPUT

  call-cursor-review:
    needs: validate-pr-metadata
    if: |
      github.repository == 'ansible-automation-platform/aap-gateway' &&
      needs.validate-pr-metadata.outputs.is_pr == 'true' &&
      contains(fromJSON('["opened", "ready_for_review"]'), needs.validate-pr-metadata.outputs.event_action)
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    uses: ./.github/workflows/cursor-pull-request.yml
    with:
      pr_number: ${{ needs.validate-pr-metadata.outputs.pr_number }}
      repository: ${{ needs.validate-pr-metadata.outputs.repository }}
      head_sha: ${{ needs.validate-pr-metadata.outputs.head_sha }}
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      AAP_PS_DAB_COLLECTION_REPO_READ: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ }}
