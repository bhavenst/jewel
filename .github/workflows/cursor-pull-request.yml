name: Cursor Code Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      repository:
        description: 'Repository name'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA'
        required: true
        type: string
    secrets:
      CURSOR_API_KEY:
        required: true
      AAP_PS_DAB_COLLECTION_REPO_READ:
        required: true

jobs:
  cursor-code-review:
    if: vars.CURSOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ env.PR_BODY }}
          GH_TOKEN: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ != '' && secrets.AAP_PS_DAB_COLLECTION_REPO_READ || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos '[ansible-automation-platform|ansible]/django-ansible-base' \
            --always-clone-repos ansible/ansible.platform

      - name: Install Cursor CLI
        run: |
          # Options applied to curl:
          #   -f: Fail if HTTP response code of 400 or higher received
          #   -s: Run in silent mode, except for the output of the request
          #   -S: Print errors on failure when running curl in silent mode
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Perform code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FORMAT: text
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REPOSITORY: ${{ inputs.repository }}
        run: |
          # Create env file that can read github token, since cursor config specification lies about its functionality
          echo "GITHUB_PERSONAL_ACCESS_TOKEN=${GH_TOKEN}" > .github_mcp_env
          # CURSOR_CONFIG_DIR does not apply mcp settings when setting the cursor config directory, so we need to symlink it to the project
          ln -s "../tools/configs/cursor/pr-review/mcp.json" .cursor/mcp.json
          # Run the actual prompt. I'm not convinced that it can recognize commands from the CLI, so we're using @file syntax instead.
          cursor-agent -f --approve-mcps --model "${CURSOR_MODEL}" --output-format="${OUTPUT_FORMAT}" --print "@.cursor/commands/pr-review.md : Repository: ${PR_REPOSITORY}. PR ${PR_NUMBER}"
